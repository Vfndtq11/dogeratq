<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МотоСтрим — смотреть</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: black;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }
        video {
            max-width: 100%;
            max-height: 90vh;
        }
        .status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 20px;
            color: #0f0;
            font-size: 12px;
        }
        .offline-status { color: #f00; }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div class="status" id="status">🔄 Подключение...</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const streamId = urlParams.get('id');
        const password = urlParams.get('pwd');
        
        let socket = null;
        let peerConnection = null;
        
        if (!streamId || !password) {
            document.getElementById('status').innerHTML = '❌ Неверная ссылка';
            document.getElementById('status').classList.add('offline-status');
        } else {
            connect();
        }
        
        async function connect() {
            socket = io();
            
            socket.on('connect', () => {
                socket.emit('viewer:join', { streamId, password }, async (response) => {
                    if (response.success) {
                        document.getElementById('status').innerHTML = '🟢 Подключено, загрузка...';
                        await startWebRTC(response.streamerSocketId);
                    } else {
                        document.getElementById('status').innerHTML = '❌ ' + response.error;
                        document.getElementById('status').classList.add('offline-status');
                    }
                });
            });
            
            socket.on('viewer:offer', async (data) => {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                socket.emit('viewer:answer', {
                    streamerSocketId: data.streamerSocketId,
                    answer: answer
                });
            });
            
            socket.on('viewer:ice-candidate', (data) => {
                peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            });
            
            socket.on('streamer:disconnected', () => {
                document.getElementById('status').innerHTML = '🔴 Стример завершил трансляцию';
                document.getElementById('status').classList.add('offline-status');
                if (peerConnection) peerConnection.close();
            });
        }
        
        async function startWebRTC(streamerSocketId) {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };
            
            peerConnection = new RTCPeerConnection(config);
            
            peerConnection.ontrack = (event) => {
                const videoElement = document.getElementById('remoteVideo');
                videoElement.srcObject = event.streams[0];
                document.getElementById('status').innerHTML = '🔴 LIVE • МотоСтрим';
            };
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('viewer:ice-candidate', {
                        streamerSocketId: streamerSocketId,
                        candidate: event.candidate
                    });
                }
            };
        }
    </script>
</body>
</html>
