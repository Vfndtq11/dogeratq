<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стример — панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #0f0;
            font-family: monospace;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
        }
        h1 { text-align: center; margin-bottom: 30px; }
        .step {
            background: #0a0a0a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 15px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 16px;
        }
        input {
            background: black;
            color: #0f0;
            border: 1px solid #0f0;
        }
        button {
            background: #0f0;
            color: black;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button.danger { background: #f00; color: white; }
        .status { padding: 15px; margin: 20px 0; border-radius: 10px; text-align: center; }
        .online { background: #0f0; color: black; }
        .offline { background: #f00; color: white; }
        .share-box {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: center;
        }
        .share-link {
            background: black;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            margin: 15px 0;
        }
        video {
            max-width: 100%;
            max-height: 300px;
            background: black;
            border-radius: 10px;
        }
        .viewer-count {
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 ПАНЕЛЬ СТРИМЕРА</h1>
        
        <div id="loginPanel">
            <div class="step">
                <h3>🔐 Вход</h3>
                <input type="password" id="password" placeholder="Пароль стримера">
                <button onclick="login()">Войти</button>
            </div>
        </div>

        <div id="streamPanel" style="display: none;">
            <div class="step">
                <h3>📡 Создать стрим</h3>
                <input type="text" id="streamId" placeholder="Stream ID (например: moto2024)">
                <input type="text" id="streamPassword" placeholder="Пароль для зрителей">
                <button onclick="createStream()">🎬 Начать стрим</button>
                <button class="danger" onclick="stopStream()">⏹ Остановить</button>
            </div>

            <div class="viewer-count">
                👥 Зрителей: <span id="viewerCount">0</span>
            </div>

            <div id="status" class="status offline">⚫ Стрим не активен</div>

            <div class="preview" id="previewArea" style="display: none;">
                <h3>📺 Предпросмотр</h3>
                <video id="previewVideo" autoplay playsinline muted></video>
            </div>

            <div class="share-box" id="shareBox" style="display: none;">
                <h3>🔗 Дай зрителям эту ссылку:</h3>
                <div class="share-link" id="streamLink"></div>
                <button onclick="copyLink()">📋 Копировать</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const STREAMER_PASS = "moto2024";
        let socket = null;
        let localStream = null;
        let peerConnection = null;
        let currentStreamId = null;
        let currentViewers = [];

        function login() {
            const pwd = document.getElementById('password').value;
            if (pwd === STREAMER_PASS) {
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('streamPanel').style.display = 'block';
                connectSocket();
            } else {
                alert('Неверный пароль!');
            }
        }

        function connectSocket() {
            socket = io();
            
            socket.on('streamer:viewer-joined', (data) => {
                document.getElementById('viewerCount').innerText = data.viewerCount;
                addChatMessage('system', '📢 Новый зритель подключился!');
            });
            
            socket.on('streamer:viewer-left', (data) => {
                document.getElementById('viewerCount').innerText = data.viewerCount;
            });
            
            socket.on('streamer:answer', async (data) => {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
            });
            
            socket.on('streamer:ice-candidate', (data) => {
                peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            });
        }

        async function createStream() {
            const streamId = document.getElementById('streamId').value.trim();
            const streamPassword = document.getElementById('streamPassword').value.trim();
            
            if (!streamId || !streamPassword) {
                alert('Введи Stream ID и пароль!');
                return;
            }
            
            currentStreamId = streamId;
            
            // Захват экрана через ScreenStream или медиаустройства
            try {
                // Для реального стрима с телефона нужно будет подключиться к ScreenStream
                // Пока используем демо-видео с веб-камеры компьютера
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('previewVideo').srcObject = localStream;
                document.getElementById('previewArea').style.display = 'block';
            } catch (err) {
                console.error('Ошибка доступа к камере:', err);
                alert('Не удалось получить доступ к камере. Убедись, что дал разрешение.');
                return;
            }
            
            // Создаём стрим на сервере
            socket.emit('streamer:create', { streamId, password: streamPassword }, (response) => {
                if (response.success) {
                    startWebRTC();
                    document.getElementById('status').className = 'status online';
                    document.getElementById('status').innerHTML = '🟢 СТРИМ АКТИВЕН!';
                    
                    const fullUrl = `${window.location.origin}/viewer.html?id=${encodeURIComponent(streamId)}&pwd=${encodeURIComponent(streamPassword)}`;
                    document.getElementById('streamLink').textContent = fullUrl;
                    document.getElementById('shareBox').style.display = 'block';
                } else {
                    alert('Ошибка: ' + response.error);
                }
            });
        }
        
        async function startWebRTC() {
            const config = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };
            
            peerConnection = new RTCPeerConnection(config);
            
            // Добавляем треки из локального стрима
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
            
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    // Отправляем ICE кандидаты всем подключённым зрителям
                    currentViewers.forEach(viewerSocketId => {
                        socket.emit('streamer:ice-candidate', {
                            viewerSocketId: viewerSocketId,
                            candidate: event.candidate
                        });
                    });
                }
            };
            
            peerConnection.onnegotiationneeded = async () => {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                // Отправляем offer всем зрителям
                currentViewers.forEach(viewerSocketId => {
                    socket.emit('streamer:offer', {
                        streamId: currentStreamId,
                        targetSocketId: viewerSocketId,
                        offer: offer
                    });
                });
            };
        }
        
        function stopStream() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peerConnection) {
                peerConnection.close();
            }
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('shareBox').style.display = 'none';
            document.getElementById('status').className = 'status offline';
            document.getElementById('status').innerHTML = '⚫ Стрим остановлен';
            document.getElementById('viewerCount').innerText = '0';
        }
        
        function copyLink() {
            const link = document.getElementById('streamLink').textContent;
            navigator.clipboard.writeText(link);
            alert('Ссылка скопирована!');
        }
        
        function addChatMessage(type, text) {
            // Для чата позже добавим
            console.log(type, text);
        }
    </script>
</body>
</html>
